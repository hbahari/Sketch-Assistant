# Unsigned debug APK for sideloading onto your own phone. Not for the Play Console.
name: Android debug APK

on:
  workflow_dispatch: {}

jobs:
  build:
    # Buildozer is best tested on 22.04. If GitHub retires that image, switch to ubuntu-latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y libtinfo5 || true   # only present on older Ubuntu
          # Pin the Python build tooling. virtualenv seeds every venv it makes with its own
          # bundled pip (26.2.2), so the runner's pip must match it -- otherwise pip 26
          # modules end up importing a pip 25 exceptions.py and the build dies with
          # "ImportError: cannot import name 'BuildDependencyInstallError'".
          python -m pip install --upgrade "pip==26.2.2"
          pip install "buildozer==1.6.0" "virtualenv==21.14.13"
          # No global Cython pin: each p4a recipe installs the exact version it
          # needs (kivy <=3.0.12, pyjnius <3.2). Forcing Cython 0.29 here makes it
          # emit pre-3.12 private C API calls that Python 3.14 rejects.

      - name: Download the face model (YuNet)
        run: python scripts/download_models.py

      - name: Cache Buildozer + Android SDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: sketch-assistant-debug-apk
          path: bin/*.apk
          if-no-files-found: error
