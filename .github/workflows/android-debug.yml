# Unsigned debug APK for sideloading onto your own phone. Not for the Play Console.
name: Android debug APK

on:
  workflow_dispatch: {}

jobs:
  build:
    # Buildozer is best tested on 22.04. If GitHub retires that image, switch to ubuntu-latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y libtinfo5 || true   # only present on older Ubuntu
          pip install "buildozer==1.6.0" "cython<3" virtualenv

      - name: Download the face model (YuNet)
        run: python scripts/download_models.py

      - name: Cache Buildozer + Android SDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: sketch-assistant-debug-apk
          path: bin/*.apk
          if-no-files-found: error
