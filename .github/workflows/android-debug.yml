# Unsigned debug APK for sideloading onto your own phone. Not for the Play Console.
name: Android debug APK

on:
  workflow_dispatch: {}

jobs:
  build:
    # Buildozer is best tested on 22.04. If GitHub retires that image, switch to ubuntu-latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y libtinfo5 || true   # only present on older Ubuntu
          # Pin the Python build tooling. virtualenv seeds every venv it makes with its own
          # bundled pip (26.2.2), so the runner's pip must match it -- otherwise pip 26
          # modules end up importing a pip 25 exceptions.py and the build dies with
          # "ImportError: cannot import name 'BuildDependencyInstallError'".
          python -m pip install --upgrade "pip==26.2.2"
          pip install "buildozer==1.6.0" "virtualenv==21.14.13"
          # No global Cython pin: each p4a recipe installs the exact version it
          # needs (kivy <=3.0.12, pyjnius <3.2). Forcing Cython 0.29 here makes it
          # emit pre-3.12 private C API calls that Python 3.14 rejects.

      - name: Download the models (~27 MB)
        run: python scripts/download_models.py

      # Cache ONLY the downloaded Android SDK/NDK (~/.buildozer). The in-repo .buildozer
      # holds the build tree, including venvs that p4a creates. Caching that tree lets a
      # half-finished venv survive into the next run: `python -m venv` re-seeds an OLD pip
      # over a NEWER one's files, leaving pip 26.2's build_env/ package beside pip 25's
      # exceptions.py -> "ImportError: cannot import name 'BuildDependencyInstallError'".
      - name: Cache the Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          # keyed on the toolchain, not the whole spec: a version bump or a new file type
          # used to throw the cache away and re-download the SDK and NDK
          key: android-sdk-ndk-r28c-api36-p4a-v2026.05.09

      # Buildozer downloads the ~700 MB NDK itself and never checks it: a truncated
      # download fails much later as "unzip ... Error code: 9" (it did, on 1.5.0, the first
      # build after the cache key changed). Fetched here with retries and a full integrity
      # test instead; buildozer finds the folder and skips its own download.
      - name: Fetch the Android NDK, checked
        run: |
          NDK=r28c   # keep in step with android.ndk in buildozer.spec
          DIR="$HOME/.buildozer/android/platform"
          if [ ! -x "$DIR/android-ndk-$NDK/ndk-build" ]; then
            mkdir -p "$DIR" && cd "$DIR" && rm -rf "android-ndk-$NDK" ndk.zip
            for i in 1 2 3; do
              curl -fL --retry 5 --retry-all-errors -o ndk.zip \
                "https://dl.google.com/android/repository/android-ndk-$NDK-linux.zip" \
                && unzip -tq ndk.zip > /dev/null && break
              echo "NDK download damaged or incomplete, retrying ($i of 3)"
              rm -f ndk.zip; sleep 15
            done
            [ -f ndk.zip ] || { echo "::error::Could not download a complete Android NDK $NDK."; exit 1; }
            unzip -q ndk.zip && rm ndk.zip
          fi
          test -x "$DIR/android-ndk-$NDK/ndk-build"

      - name: Start from a clean build tree
        run: rm -rf .buildozer

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: sketch-assistant-debug-apk
          path: bin/*.apk
          if-no-files-found: error
