# Signed .aab (upload this to the Play Console) and a signed universal .apk (for sideloading).
# Requires four repository secrets - see PLAYSTORE.md:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Android release (AAB + APK)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the signing secrets are present
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See PLAYSTORE.md, step 2."
            exit 1
          fi

      - name: Restore the keystore and check the alias
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
                 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                 -alias "${{ secrets.KEY_ALIAS }}" > /dev/null 2>&1; then
            echo "::error::KEY_ALIAS '${{ secrets.KEY_ALIAS }}' is not in the keystore, or KEYSTORE_PASSWORD is wrong."
            echo "Aliases actually present:"
            keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null | grep -i "PrivateKeyEntry" || true
            exit 1
          fi
          echo "Alias OK."

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y libtinfo5 || true
          pip install "buildozer==1.6.0" "cython<3" virtualenv

      - name: Download the face model (YuNet)
        run: python scripts/download_models.py

      - name: Cache Buildozer + Android SDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build signed AAB
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/upload.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: yes | buildozer -v android release

      - name: Verify the bundle is signed
        run: |
          AAB=$(ls bin/*.aab | head -1)
          echo "Bundle: $AAB"
          jarsigner -verify "$AAB" | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt || {
            echo "::error::The .aab came out unsigned - check the four signing secrets."; exit 1; }

      - name: Build a signed universal APK from the bundle
        run: |
          URL=$(curl -sS https://api.github.com/repos/google/bundletool/releases/latest \
                | grep -o 'https://[^"]*bundletool-all-[^"]*\.jar' | head -1)
          curl -sSL "$URL" -o bundletool.jar
          AAB=$(ls bin/*.aab | head -1)
          java -jar bundletool.jar build-apks --mode=universal \
            --bundle="$AAB" --output=bin/universal.apks \
            --ks="$RUNNER_TEMP/upload.keystore" \
            --ks-pass="pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias="${{ secrets.KEY_ALIAS }}" \
            --key-pass="pass:${{ secrets.KEY_PASSWORD }}"
          unzip -p bin/universal.apks universal.apk > bin/sketch-assistant-universal.apk
          ls -la bin/

      - uses: actions/upload-artifact@v4
        with:
          name: sketch-assistant-release
          path: |
            bin/*.aab
            bin/sketch-assistant-universal.apk
          if-no-files-found: error
